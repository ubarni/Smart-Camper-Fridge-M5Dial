substitutions:
  name: "smart-camper-fridge-m5dial"
  friendly_name: "Smart Camper Fridge M5Dial"
  
  # External pins via M5Dial Grove connectors
  pwm_pin:        "GPIO15" # Port A Yellow (PWM output to SECOP controller)
  diag_pin:       "GPIO13" # Port A White  (Input for SECOP diagnostic pulses)

  dallas_bus_pin: "GPIO2"  # Port B Yellow (Shared pin for ALL 3 OneWire temp sensors)
  voltage_pin:    "GPIO1"  # Port B White  (Input for battery voltage divider)
  
esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  on_boot:
    priority: 800
    then:
      # 1. Initialize error text sensor to OK via Lambda
      - lambda: |-
          id(secop_error_text).publish_state("OK");
      # 2. Set backlight initially to 70% via number component
      - number.set:
          id: display_brightness_pct
          value: 70

esp32:
  variant: esp32s3
  framework:
    type: arduino

logger:
  level: DEBUG
  logs:
    sensor: INFO
    adc: INFO

api:
  encryption:
    key: "UpqtwOF9dFA0zdkV585rFijX4IySnybn2vuiYRxFG/g="

ota:
  - platform: esphome
    password: "33c564707f7fd52c1bcca740107f8da4"
    
wifi:
  networks:
    - ssid: !secret wifi_ssid_ssid
      password: !secret wifi_ssid_password
      priority: 1
    - ssid: !secret wifi_backup_ssid_ssid
      password: !secret wifi_backup_ssid_password
      priority: 10
  fast_connect: false
  power_save_mode: none
  ap:
    ssid: "Camper Fridge"
    password: !secret ap_password

captive_portal:
  
web_server:
  port: 80
  version: 3
  local: true

globals:
  - id: last_compressor_stop
    type: uint32_t
    initial_value: '0'
  - id: is_updating
    type: bool
    initial_value: 'false'
  - id: in_soft_start
    type: bool
    initial_value: 'false'
  - id: error_pulse_count
    type: int
    initial_value: '0'
  - id: ui_mode
    type: int
    initial_value: '0'     # 0 = Temp (Blue), 1 = Speed (Orange), 2 = Brightness (Yellow)
  - id: lower_display_page
    type: int
    initial_value: '0'     # 0 = All Temperatures, 1 = Power & Battery
  - id: soft_start_start_time
    type: uint32_t
    initial_value: '0'

# Internal I2C bus for the M5Dial touchscreen board
i2c:
  - id: bus_internal
    sda: GPIO11
    scl: GPIO12
    frequency: 400kHz   
    scan: true

# Touchscreen driver
touchscreen:
  - platform: ft5x06
    address: 0x38
    id: dial_touch
    i2c_id: bus_internal
    interrupt_pin: GPIO14

# Internal SPI bus configuration for the M5Dial display
spi:
  id: spi_bus
  mosi_pin: GPIO5
  clk_pin: GPIO6
    
output:
  - platform: ledc
    pin: GPIO9
    id: backlight_output
    
  - platform: ledc
    pin: ${pwm_pin}
    id: secop_pwm_output
    frequency: 5000Hz

light:
  - platform: monochromatic
    name: "Display Backlight"
    output: backlight_output
    id: display_backlight
    restore_mode: RESTORE_DEFAULT_OFF

# Central OneWire bus on a single pin
one_wire:
  - platform: gpio
    pin: ${dallas_bus_pin}
    id: dallas_bus

sensor:
  # --- HARDWARE SENSORS (Reads values sequentially from the bus) ---
  - platform: dallas_temp
    one_wire_id: dallas_bus
    index: 0
    id: raw_sensor_0
    name: "Physical Sensor Index 0"
    update_interval: 10s
    entity_category: "diagnostic"

  - platform: dallas_temp
    one_wire_id: dallas_bus
    index: 1
    id: raw_sensor_1
    name: "Physical Sensor Index 1"
    update_interval: 10s
    entity_category: "diagnostic"

  - platform: dallas_temp
    one_wire_id: dallas_bus
    index: 2
    id: raw_sensor_2
    name: "Physical Sensor Index 2"
    update_interval: 10s
    entity_category: "diagnostic"

  # --- VIRTUAL SENSORS (Future-proof assignment without deprecation warnings) ---
  - platform: template
    name: "Temp Fridge"
    id: fridge_temp
    unit_of_measurement: "°C"
    update_interval: 10s
    filters:
      - sliding_window_moving_average:
          window_size: 6 
          send_every: 1 
    lambda: |-
      std::string choice = id(select_fridge_sensor).current_option(); // <-- Update for ESPHome 2026.7+
      if (choice == "Index 0") return id(raw_sensor_0).state;
      if (choice == "Index 1") return id(raw_sensor_1).state;
      return id(raw_sensor_2).state;

  - platform: template
    name: "Temp Freezer"
    id: freezer_temp
    unit_of_measurement: "°C"
    update_interval: 10s
    lambda: |-
      std::string choice = id(select_freezer_sensor).current_option();
      if (choice == "Index 0") return id(raw_sensor_0).state;
      if (choice == "Index 1") return id(raw_sensor_1).state;
      return id(raw_sensor_2).state;

  - platform: template
    name: "Temp Compressor"
    id: compressor_temp
    unit_of_measurement: "°C"
    update_interval: 10s
    lambda: |-
      std::string choice = id(select_compressor_sensor).current_option();
      if (choice == "Index 0") return id(raw_sensor_0).state;
      if (choice == "Index 1") return id(raw_sensor_1).state;
      return id(raw_sensor_2).state;

  - platform: adc
    pin: ${voltage_pin}
    name: "Fridge Voltage"
    id: fridge_voltage
    update_interval: 2s
    unit_of_measurement: "V"
    accuracy_decimals: 1
    attenuation: auto
    filters:
      - sliding_window_moving_average:
          window_size: 5
          send_every: 1
      - lambda: return x * id(volt_multiplier).state;

  # Integrated software power estimation
  - platform: template
    name: "Fridge Power"
    id: fridge_power
    unit_of_measurement: "W"
    accuracy_decimals: 0
    update_interval: 10s
    lambda: |-
      if (!id(compressor_state).state) return 0.0f;
      float speed = id(compressor_speed_pct).state;
      // Real values: ~57W at lowest speed, ~72W at full throttle (15W span)
      return 57.0f + ((speed / 100.0f) * 15.0f);

  - platform: integration
    sensor: fridge_power
    name: "Fridge Energy"
    id: fridge_energy_wh
    unit_of_measurement: "Wh"
    accuracy_decimals: 0
    icon: "mdi:counter"
    time_unit: h
    restore: true
    
  # Calculates the remaining startup lock time in seconds
  - platform: template
    name: "Startup Lock Remain"
    id: startup_lock_remaining
    unit_of_measurement: "s"
    accuracy_decimals: 0
    icon: "mdi:timer-sand"
    update_interval: 1s
    entity_category: "diagnostic"
    lambda: |-
      uint32_t now = millis();
      uint32_t lock_ms = (uint32_t)id(startup_lock_duration).state * 1000;
      if (id(last_compressor_stop) == 0 || (now - id(last_compressor_stop) >= lock_ms)) {
        return 0;
      } else {
        return (float)(lock_ms - (now - id(last_compressor_stop))) / 1000.0f;
      }

  - platform: wifi_signal 
    name: "WiFi Signal dB"
    id: wifi_signal_db
    update_interval: 60s
    entity_category: "diagnostic"

  - platform: copy 
    source_id: wifi_signal_db
    name: "WiFi Signal Strength"
    id: wifi_signal_pct
    filters:
      - lambda: return min(max(2 * (x + 100.0), 0.0), 100.0);
    unit_of_measurement: "%"
    entity_category: "diagnostic"

  # ADAPTIVE ROTARY ENCODER CONTROL
  - platform: rotary_encoder
    id: dial_encoder
    pin_a:
      number: GPIO40
      mode: INPUT_PULLUP
    pin_b:
      number: GPIO41
      mode: INPUT_PULLUP
    on_clockwise:
      - lambda: |-
          if (id(ui_mode) == 0) {
            float next_val = id(target_temp).state + 1.0f;
            if (next_val <= 20.0f) id(target_temp).make_call().set_value(next_val).perform();
          } else if (id(ui_mode) == 1) {
            float next_val = id(compressor_speed_pct).state + 1.0f;
            if (next_val <= 100.0f) id(compressor_speed_pct).make_call().set_value(next_val).perform();
          } else if (id(ui_mode) == 2) {
            float next_val = id(display_brightness_pct).state + 10.0f;
            if (next_val <= 100.0f) id(display_brightness_pct).make_call().set_value(next_val).perform();
          } else if (id(ui_mode) == 3) {
            float next_val = id(freezer_target_temp).state + 1.0f;
            if (next_val <= 0.0f) id(freezer_target_temp).make_call().set_value(next_val).perform();
          }
    on_anticlockwise:
      - lambda: |-
          if (id(ui_mode) == 0) {
            float next_val = id(target_temp).state - 1.0f;
            if (next_val >= 1.0f) id(target_temp).make_call().set_value(next_val).perform();
          } else if (id(ui_mode) == 1) {
            float next_val = id(compressor_speed_pct).state - 1.0f;
            if (next_val >= 0.0f) id(compressor_speed_pct).make_call().set_value(next_val).perform();
          } else if (id(ui_mode) == 2) {
            float next_val = id(display_brightness_pct).state - 10.0f;
            if (next_val >= 10.0f) id(display_brightness_pct).make_call().set_value(next_val).perform();
          } else if (id(ui_mode) == 3) {
            float next_val = id(freezer_target_temp).state - 1.0f;
            if (next_val >= -20.0f) id(freezer_target_temp).make_call().set_value(next_val).perform();
          }

number:
  - platform: template
    name: "Compressor Speed"
    id: compressor_speed_pct
    min_value: 0
    max_value: 100
    step: 1
    initial_value: 50 
    unit_of_measurement: "%"
    optimistic: true
    on_value:
      - lambda: |-
          // 1. Hardware output to the compressor (Safe limits applied!)
          if (id(compressor_state).state) {
            // 0% = 0.40f (40% PWM) | 100% = 0.14f (14% PWM - prevents shutdown!)
            float pwm_val = 0.40f - (x / 100.0f) * 0.26f;
            id(secop_pwm_output).set_level(pwm_val);
          }
          
          // 2. Preset synchronization
          if (id(is_updating)) return; 
          
          id(is_updating) = true;
          int val = (int)round(x);
          std::string mode = "Manually";

          if (val == (int)round(id(compressor_preset_night).state))       mode = "Night";
          else if (val == (int)round(id(compressor_preset_normal).state)) mode = "Normal";
          else if (val == (int)round(id(compressor_preset_power).state))  mode = "Power";

          if (id(compressor_mode_select).current_option() != mode) {
            auto call = id(compressor_mode_select).make_call();
            call.set_option(mode);
            call.perform();
          }
          id(is_updating) = false;

          // 3. Log entry for Home Assistant
          char buf[64];
          sprintf(buf, "Comp Speed Manual: %.0f%%", x);
          id(fridge_settings_log).publish_state(buf);
          
  - platform: template
    name: "Display Brightness"
    id: display_brightness_pct
    min_value: 10
    max_value: 100
    step: 10
    initial_value: 70
    unit_of_measurement: "%"
    optimistic: true
    icon: "mdi:brightness-6"
    on_value:
      - light.control:
          id: display_backlight
          brightness: !lambda return x / 100.0f;

  # Configurable Low Voltage Disconnect in Home Assistant (Default 11.5V)
  - platform: template
    name: "Low Voltage Cutoff"
    id: low_voltage_cutoff
    entity_category: config
    min_value: 9.0
    max_value: 26.0
    step: 0.1
    initial_value: 11.5
    restore_value: true
    optimistic: true
    unit_of_measurement: "V"
    icon: "mdi:battery-alert"
    on_value:
      - lambda: |-
          char buf[64];
          sprintf(buf, "LVD: %.1fV", x);
          id(fridge_settings_log).publish_state(buf);

  # --- CONFIG: COMPRESSOR SPEED PRESETS ---
  - platform: template
    name: "Compressor Preset Night"
    id: compressor_preset_night
    entity_category: config
    min_value: 10
    max_value: 100
    step: 1
    initial_value: 20
    restore_value: true
    optimistic: true
    unit_of_measurement: "%"

  - platform: template
    name: "Compressor Preset Normal"
    id: compressor_preset_normal
    entity_category: config
    min_value: 10
    max_value: 100
    step: 1
    initial_value: 50
    restore_value: true
    optimistic: true
    unit_of_measurement: "%"

  - platform: template
    name: "Compressor Preset Power"
    id: compressor_preset_power
    entity_category: config
    min_value: 10
    max_value: 100
    step: 1
    initial_value: 80
    restore_value: true
    optimistic: true
    unit_of_measurement: "%"

  # --- CONFIG: TEMPERATURE PRESETS ---
  - platform: template
    name: "Temp Preset Cold"
    id: temp_preset_cold
    entity_category: config
    min_value: 0
    max_value: 20
    step: 1
    initial_value: 2
    restore_value: true
    optimistic: true
    unit_of_measurement: "°C"

  - platform: template
    name: "Temp Preset Fresh"
    id: temp_preset_fresh
    entity_category: config
    min_value: 0
    max_value: 20
    step: 1
    initial_value: 4
    restore_value: true
    optimistic: true
    unit_of_measurement: "°C"

  - platform: template
    name: "Temp Preset Eco"
    id: temp_preset_eco
    entity_category: config
    min_value: 0
    max_value: 20
    step: 1
    initial_value: 6
    restore_value: true
    optimistic: true
    unit_of_measurement: "°C"

  - platform: template
    name: "Temp Preset Vacation"
    id: temp_preset_vacation
    entity_category: config
    min_value: 0
    max_value: 20
    step: 1
    initial_value: 10
    restore_value: true
    optimistic: true
    unit_of_measurement: "°C"

  - platform: template
    name: "Temp Target"
    id: target_temp
    unit_of_measurement: "°C"
    min_value: 1
    max_value: 20  
    step: 1
    initial_value: 5
    restore_value: true
    optimistic: true
    on_value:
      - lambda: |-
          if (id(is_updating)) return; 
          
          id(is_updating) = true;
          int val = (int)round(x);
          std::string mode = "Manually";

          // Check if the manually set value exactly matches a preset
          if (val == (int)round(id(temp_preset_cold).state))          mode = "Cold";
          else if (val == (int)round(id(temp_preset_fresh).state))    mode = "Fresh";
          else if (val == (int)round(id(temp_preset_eco).state))      mode = "Eco";
          else if (val == (int)round(id(temp_preset_vacation).state)) mode = "Vacation";

          // Update the dropdown menu if the mode has changed
          if (id(target_temp_select).current_option() != mode) {
            auto call = id(target_temp_select).make_call();
            call.set_option(mode);
            call.perform();
          }
          id(is_updating) = false;
          
          // --- Log entry for Home Assistant ---
          char buf[64];
          sprintf(buf, "Fridge Target: %.0f°C", x);
          id(fridge_settings_log).publish_state(buf);

  - platform: template
    name: "Freezer Target Temp"
    id: freezer_target_temp
    unit_of_measurement: "°C"
    min_value: -20
    max_value: 0
    step: 1
    initial_value: -10
    restore_value: true
    optimistic: true
    icon: "mdi:thermometer-minus"
    on_value:
      - lambda: |-
          char buf[64];
          sprintf(buf, "Freezer Target: %.0f°C", x);
          id(fridge_settings_log).publish_state(buf);

  - platform: template
    name: "Hysteresis"
    id: fridge_hysteresis
    unit_of_measurement: "°C"
    min_value: 0.5
    max_value: 3.0
    step: 0.1
    initial_value: 1.5
    restore_value: true
    optimistic: true
    entity_category: config
    on_value:
      - lambda: |-
          char buf[64];
          sprintf(buf, "Hysteresis: %.1f°C", x);
          id(fridge_settings_log).publish_state(buf);

  - platform: template
    name: "Startup Lock Duration"
    id: startup_lock_duration
    unit_of_measurement: "s"
    min_value: 10
    max_value: 60
    step: 10
    initial_value: 30
    restore_value: true
    optimistic: true
    icon: "mdi:timer-cog"
    entity_category: config
    on_value:
      - lambda: |-
          char buf[64];
          sprintf(buf, "Locktime: %.0fs", x);
          id(fridge_settings_log).publish_state(buf);

  - platform: template
    name: "Calibration: Voltage-Multiplier"
    id: volt_multiplier
    entity_category: config
    min_value: 1.0
    max_value: 10.0
    step: 0.01
    initial_value: 5.73
    restore_value: true
    optimistic: true

select:
  - platform: template
    name: "Temp Target Mode"
    id: target_temp_select
    options: ["Cold", "Fresh", "Eco", "Vacation", "Manually"]
    initial_option: "Cold"
    restore_value: true
    optimistic: true
    set_action:
      - lambda: |-
          if (x == "Manually") return;
          float val = 5.0;
          if (x == "Cold")           val = id(temp_preset_cold).state;
          else if (x == "Fresh")     val = id(temp_preset_fresh).state;
          else if (x == "Eco")       val = id(temp_preset_eco).state;
          else if (x == "Vacation")  val = id(temp_preset_vacation).state;
          
          if (val > 0.0f) { 
            id(target_temp).make_call().set_value(val).perform();
          }
          // --- Log entry ---
          char buf[64];
          sprintf(buf, "Temp Mode: %s (%.0f°C)", x.c_str(), val);
          id(fridge_settings_log).publish_state(buf);

  - platform: template
    name: "Compressor Mode"
    id: compressor_mode_select
    options: ["Night", "Normal", "Power", "Manually"]
    initial_option: "Normal"
    restore_value: true
    optimistic: true
    set_action:
      - lambda: |-
          if (x == "Manually") return;
          float target_pct = 50.0f;
          if (x == "Night")       target_pct = id(compressor_preset_night).state;
          else if (x == "Normal") target_pct = id(compressor_preset_normal).state;
          else if (x == "Power")  target_pct = id(compressor_preset_power).state;
          id(compressor_speed_pct).make_call().set_value(target_pct).perform();
          // --- Log entry ---
          char buf[64];
          sprintf(buf, "Comp Mode: %s (%.0f%%)", x.c_str(), target_pct);
          id(fridge_settings_log).publish_state(buf);

# --- DYNAMIC SENSOR MAPPING IN WEB UI (Power-loss safe due to restore_value!) ---
  - platform: template
    name: "Assign Fridge Sensor"
    id: select_fridge_sensor
    options: ["Index 0", "Index 1", "Index 2"]
    optimistic: true
    restore_value: true
    initial_option: "Index 0"
    icon: "mdi:vector-point"
    entity_category: "config"

  - platform: template
    name: "Assign Freezer Sensor"
    id: select_freezer_sensor
    options: ["Index 0", "Index 1", "Index 2"]
    optimistic: true
    restore_value: true
    initial_option: "Index 1"
    icon: "mdi:vector-point"
    entity_category: "config"

  - platform: template
    name: "Assign Compressor Sensor"
    id: select_compressor_sensor
    options: ["Index 0", "Index 1", "Index 2"]
    optimistic: true
    restore_value: true
    initial_option: "Index 2"
    icon: "mdi:vector-point"
    entity_category: "config"

text_sensor:
  - platform: template
    name: "Fridge State"
    id: fridge_state_log
    entity_category: "diagnostic"

  - platform: template
    name: "Fridge Error"
    id: secop_error_text
    entity_category: "diagnostic"

  - platform: template
    name: "Last Setting"
    id: fridge_settings_log
    icon: "mdi:cog-transfer"
    entity_category: "diagnostic"

  - platform: wifi_info
    mac_address:
      name: "MAC Address"
      entity_category: "diagnostic"
    ip_address:
      name: "IP Address"
      entity_category: "diagnostic"

binary_sensor:
  - platform: gpio
    pin:
      number: ${diag_pin}
      inverted: true        
      mode: INPUT_PULLUP    
    id: secop_error_pulse
    internal: true          
    on_press:
      then:
        - lambda: |-
            id(error_pulse_count)++;
            id(error_decode_script).execute(); 

  # 1. BOTTOM TOUCH AREA: Toggles info pages
  - platform: touchscreen
    id: lower_screen_touch
    touchscreen_id: dial_touch
    x_min: 0
    x_max: 240
    y_min: 170
    y_max: 240
    on_press:
      then:
        - lambda: |-
            if (!id(fridge_main_switch).state) return;
            id(lower_display_page) = (id(lower_display_page) + 1) % 2;

  # 2. CENTER TOUCH AREA: Cycles through all 4 modes
  - platform: touchscreen
    id: center_screen_touch
    touchscreen_id: dial_touch
    x_min: 0
    x_max: 240
    y_min: 50
    y_max: 169
    on_press:
      then:
        - lambda: |-
            if (!id(fridge_main_switch).state) return;
            id(ui_mode) = (id(ui_mode) + 1) % 4;

  # 3. PHYSICAL DISPLAY BUTTON
  - platform: gpio
    pin:
      number: GPIO42
      inverted: true
    name: "Dial Main Button"
    id: dial_main_button
    on_multi_click:
      # SINGLE CLICK: Cycles through profiles / Toggles Freezer Guard
      - timing:
          - ON for at most 0.6s
          - OFF for at least 0.3s
        then:
          - lambda: |-
              if (!id(fridge_main_switch).state) return; 
              
              if (id(ui_mode) == 0) {
                size_t next_idx = (id(target_temp_select).active_index().value_or(0) + 1) % 4;
                float val = (next_idx == 0) ? id(temp_preset_cold).state : 
                            (next_idx == 1) ? id(temp_preset_fresh).state : 
                            (next_idx == 2) ? id(temp_preset_eco).state : id(temp_preset_vacation).state;
                if (val > 0.0f) id(target_temp_select).make_call().set_index(next_idx).perform();

              } else if (id(ui_mode) == 1) {
                size_t next_index = (id(compressor_mode_select).active_index().value_or(0) + 1) % 3; 
                id(compressor_mode_select).make_call().set_index(next_index).perform();

              } else if (id(ui_mode) == 2) {
                float cur = id(display_brightness_pct).state;
                float next = (cur == 30.0f) ? 70.0f : (cur == 70.0f) ? 100.0f : 30.0f;
                id(display_brightness_pct).make_call().set_value(next).perform();
                
              } else if (id(ui_mode) == 3) {
                if (id(freezer_guard_mode).state) {
                  id(freezer_guard_mode).turn_off();
                } else {
                  id(freezer_guard_mode).turn_on();
                }
              }
              
      # DOUBLE CLICK: Cycles through all 4 modes
      - timing:
          - ON for at most 0.5s
          - OFF for at most 0.3s
          - ON for at most 0.5s
          - OFF for at least 0.2s
        then:
          - lambda: |-
              if (!id(fridge_main_switch).state) return; 
              id(ui_mode) = (id(ui_mode) + 1) % 4; // JETZT MODULO 4! 

      # LONG PRESS: Turn system ON / OFF
      - timing:
          - ON for at least 1s
        then:
          - if:
              condition:
                lambda: 'return id(fridge_main_switch).state;'
              then:
                - switch.turn_off: fridge_main_switch
                - light.turn_off: display_backlight
              else:
                - switch.turn_on: fridge_main_switch
                - light.turn_on: display_backlight

switch:
  - platform: template
    name: "Fridge Main Switch"
    id: fridge_main_switch
    optimistic: true
    # Saves state and restores it after update/power loss.
    # (Defaults to OFF on first boot for safety)
    restore_mode: RESTORE_DEFAULT_OFF 
    on_turn_on:
      - lambda: |-
          id(fridge_settings_log).publish_state("Main Switch: ON");
          id(fridge_state_log).publish_state("Main Switch: ON");
    on_turn_off:
      - script.stop: compressor_start_routine 
      - switch.turn_off: compressor_state
      - lambda: |-
          id(fridge_settings_log).publish_state("Main Switch: OFF");
          id(fridge_state_log).publish_state("Main Switch: OFF");
          
  - platform: template
    name: "Compressor State"
    id: compressor_state
    optimistic: true
    entity_category: diagnostic
    on_turn_off:
      - script.stop: compressor_start_routine
      - lambda: 'id(secop_pwm_output).set_level(0.0f);'

  - platform: template
    name: "Freezer Guard Mode"
    id: freezer_guard_mode
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF 
    icon: "mdi:snowflake-alert"
    on_turn_on:
      - lambda: 'id(fridge_settings_log).publish_state("Freezer Guard: ON");'
    on_turn_off:
      - lambda: 'id(fridge_settings_log).publish_state("Freezer Guard: OFF");'

font:
  - file: "gfonts://Roboto"
    id: font_small
    size: 18
    glyphs: ' !"#$%&''()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\]^_`abcdefghijklmnopqrstuvwxyz{|}~°ÄÖÜäöü'
  - file: "gfonts://Roboto"
    id: font_medium
    size: 22
    glyphs: ' !"#$%&''()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\]^_`abcdefghijklmnopqrstuvwxyz{|}~°ÄÖÜäöü'
  - file: "gfonts://Roboto"
    id: font_large
    size: 48  
    glyphs: ' -0123456789°E?OF%STANDBY'
  - file: "gfonts://Roboto"
    id: font_huge
    size: 72  
    glyphs: ' -0123456789°E?OF%STANDBY'

  # Loads official Material Design icons directly into the system
  - file: "https://github.com/Templarian/MaterialDesign-Webfont/raw/v5.4.55/fonts/materialdesignicons-webfont.ttf"
    id: font_icons
    size: 20
    glyphs:
      - "\U000F0290" # mdi-fridge
      - "\U000F0717" # mdi-snowflake (Freezer)
      - "\U000F0493" # mdi-cog (Compressor)
      - "\U000F0241" # mdi-flash (Power)
      - "\U000F010C" # mdi-battery
      - "\U000F05A9" # mdi-wifi
    
# ROUND DISPLAY CONFIGURATION (Standby-Fix & High-Performance Layout via MIPI SPI)
display:
  - platform: mipi_spi
    id: round_display
    model: GC9A01A
    cs_pin: GPIO7
    reset_pin: GPIO8
    dc_pin: GPIO4
    rotation: 0
    update_interval: 250ms
    invert_colors: true       
    color_order: BGR          
    lambda: |-
      Color c_bg       = Color(0, 0, 0);          
      Color c_blue     = Color(0, 130, 255);      
      Color c_orange   = Color(255, 110, 0);  
      Color c_cyan     = Color(0, 255, 255);
      Color c_yellow   = Color(255, 200, 0);      
      Color c_white    = Color(240, 240, 240);    
      Color c_dark_gray= Color(40, 40, 40);       
      Color c_gray     = Color(130, 130, 130);    
      Color c_green    = Color(46, 204, 113);     
      Color c_red      = Color(231, 76, 60);      

      // Fill background with pure black
      it.fill(c_bg);

      // --- SYSTEM STANDBY MODE ---
      // Prevents drawing rings or values when the system is off
      if (!id(fridge_main_switch).state) {
        it.printf(120, 120, id(font_large), c_dark_gray, TextAlign::CENTER, "STANDBY");
        return; // Exits lambda immediately -> Everything else remains invisible/black
      }

      // --- 1. CALCULATE ADAPTIVE MODE PARAMETERS ---
      Color mode_color = c_blue;
      if (id(ui_mode) == 1)      mode_color = c_orange;
      else if (id(ui_mode) == 2) mode_color = c_yellow;
      else if (id(ui_mode) == 3) mode_color = c_cyan;
      
      float pct = 0.0f;
      if (id(ui_mode) == 0) {
        float t_target = id(target_temp).state;
        if (!std::isnan(t_target)) pct = (t_target - 1.0f) / 19.0f; 
      } else if (id(ui_mode) == 1) {
        float s_target = id(compressor_speed_pct).state;
        if (!std::isnan(s_target)) pct = s_target / 100.0f; 
      } else if (id(ui_mode) == 2) {
        float b_target = id(display_brightness_pct).state;
        if (!std::isnan(b_target)) pct = b_target / 100.0f; 
      } else if (id(ui_mode) == 3) {
        float fz_target = id(freezer_target_temp).state;
        // Skaliere -20°C bis 0°C auf 0.0 bis 1.0
        if (!std::isnan(fz_target)) pct = (fz_target + 20.0f) / 20.0f; 
      }
      
      if (pct < 0.0f) pct = 0.0f;
      if (pct > 1.0f) pct = 1.0f;

      int target_angle = 150 + int(pct * 240.0f);

      // --- 2. HIGH-PERFORMANCE DRAWING OF THE MASSIVE RING ---
      for (int a = 150; a < 390; a += 2) {
        float angle1 = a * 3.14159265f / 180.0f;
        float angle2 = (a + 2) * 3.14159265f / 180.0f;
        
        float cos1 = cosf(angle1);
        float sin1 = sinf(angle1);
        float cos2 = cosf(angle2);
        float sin2 = sinf(angle2);
        
        Color segment_color = (a < target_angle) ? mode_color : c_dark_gray;

        for (int r = 104; r <= 112; r++) {
          int x1 = 120 + int(cos1 * r);
          int y1 = 120 + int(sin1 * r);
          int x2 = 120 + int(cos2 * r);
          int y2 = 120 + int(sin2 * r);
          it.line(x1, y1, x2, y2, segment_color);
        }
      }

      // --- 3. TOP AREA: Dynamic Temperature Mode Text ---
      if (id(ui_mode) == 3) {
        it.printf(120, 44, id(font_medium), c_cyan, TextAlign::CENTER, "Freezer");
      } else {
        std::string t_mode = "Manual";
        float top_t_target = id(target_temp).state;
        if (!std::isnan(top_t_target)) {
          if (top_t_target == id(temp_preset_cold).state && id(temp_preset_cold).state > 0.0f)              t_mode = "Cold";
          else if (top_t_target == id(temp_preset_fresh).state && id(temp_preset_fresh).state > 0.0f)       t_mode = "Fresh";
          else if (top_t_target == id(temp_preset_eco).state && id(temp_preset_eco).state > 0.0f)           t_mode = "Eco";
          else if (top_t_target == id(temp_preset_vacation).state && id(temp_preset_vacation).state > 0.0f) t_mode = "Vacation";
        }
        it.printf(120, 44, id(font_medium), c_blue, TextAlign::CENTER, "%s", t_mode.c_str());
      }
      
      // --- 5. CENTER AREA: Triple-Adaptive Large Display & Error Handling ---
      std::string err_state = id(secop_error_text).state;
      bool has_error = (err_state.rfind("E", 0) == 0);

      if (has_error) {
        // Extracts e.g. "E3" for the large display
        std::string err_code = err_state.substr(0, 2);
        it.printf(120, 95, id(font_huge), c_red, TextAlign::CENTER, "%s", err_code.c_str());
        
        // Extracts the plain text (everything after the 4th character, e.g. "EX: ")
        std::string err_sub = "UNKNOWN ERROR";
        if (err_state.length() > 4) {
          err_sub = err_state.substr(4);
        }
        
        // Prints the exact error cause in red (e.g. "Motor failure")
        it.printf(120, 132, id(font_small), c_red, TextAlign::CENTER, "%s", err_sub.c_str());
      } else {
      if (id(ui_mode) == 0) {
          float t_target = id(target_temp).state;
          if (!std::isnan(t_target)) {
            // Completely static and perfectly centered! No shifting.
            it.printf(120, 90, id(font_huge), c_blue, TextAlign::CENTER, "%.0f°", t_target); 
          }
          // Mode text below: Now Compressor Mode
          std::string c_mode = "Manual";
          float c_curr = id(compressor_speed_pct).state;
          if (!std::isnan(c_curr)) {
            if (c_curr == id(compressor_preset_night).state)       c_mode = "Night";
            else if (c_curr == id(compressor_preset_normal).state) c_mode = "Normal";
            else if (c_curr == id(compressor_preset_power).state)  c_mode = "Power";
          }
          it.printf(120, 153, id(font_medium), c_orange, TextAlign::CENTER, "%s", c_mode.c_str());
        } else if (id(ui_mode) == 1) {
          float s_target = id(compressor_speed_pct).state;
          if (!std::isnan(s_target)) {
            it.printf(120, 90, id(font_huge), c_orange, TextAlign::CENTER, "%.0f%%", s_target); 
          }
          // Show compressor preset here as well
          std::string c_mode = "Manual";
          if (!std::isnan(s_target)) {
            if (s_target == id(compressor_preset_night).state)       c_mode = "Night";
            else if (s_target == id(compressor_preset_normal).state) c_mode = "Normal";
            else if (s_target == id(compressor_preset_power).state)  c_mode = "Power";
          }
          it.printf(120, 153, id(font_medium), c_orange, TextAlign::CENTER, "%s", c_mode.c_str());
        } else if (id(ui_mode) == 2) {
          float b_target = id(display_brightness_pct).state;
          if (!std::isnan(b_target)) {
            it.printf(120, 90, id(font_huge), c_yellow, TextAlign::CENTER, "%.0f%%", b_target); 
          }
          it.printf(120, 153, id(font_medium), c_yellow, TextAlign::CENTER, "Brightness"); 
        } else if (id(ui_mode) == 3) {
          float fz_target = id(freezer_target_temp).state;
          if (!std::isnan(fz_target)) {
            it.printf(120, 90, id(font_huge), c_cyan, TextAlign::CENTER, "%.0f°", fz_target); 
          }
          if (id(freezer_guard_mode).state) {
            it.printf(120, 153, id(font_medium), c_cyan, TextAlign::CENTER, "Guard ON"); 
          } else {
            it.printf(120, 153, id(font_medium), c_gray, TextAlign::CENTER, "Guard OFF"); 
          }
        }
      }

      // --- 5.5. STATUS NOTIFICATIONS (Locktime / Softstart) ---
      float lock_remain = id(startup_lock_remaining).state;
      bool is_locked = (id(startup_lock_remaining).has_state() && lock_remain > 0.0f);

      if (is_locked) {
        char buf[32];
        sprintf(buf, "Locktime: %ds", (int)lock_remain);
        it.printf(120, 132, id(font_small), c_red, TextAlign::CENTER, "%s", buf);
      } 
      else if (id(in_soft_start)) {
        uint32_t elapsed = millis() - id(soft_start_start_time);
        int soft_start_remain = 30 - (elapsed / 1000);
        if (soft_start_remain < 0) soft_start_remain = 0;
        
        char buf[32];
        sprintf(buf, "Softstart: %ds", soft_start_remain);
        it.printf(120, 132, id(font_small), c_yellow, TextAlign::CENTER, "%s", buf);
      }

      // --- 6. BOTTOM AREA: Real Values & Speed Bar ---
      // Bar background (Dark gray)
      it.filled_rectangle(60, 168, 120, 3, c_dark_gray);
      
      // Current Compressor Speed as a bar
      float speed_pct = id(compressor_speed_pct).state;
      if (!std::isnan(speed_pct) && speed_pct > 0.0f) {
          int bar_width = (int)((speed_pct / 100.0f) * 120.0f);
          if (bar_width > 120) bar_width = 120;
          
          Color bar_color = c_gray; 
          
          if (is_locked) {
              bar_color = c_red;
          } else if (id(in_soft_start)) {
              bar_color = c_yellow;
          } else if (id(compressor_state).state) {
              bar_color = c_orange;
          }
          
          it.filled_rectangle(60, 168, bar_width, 3, bar_color);
      }

      // --- VALUE COLUMNS ---
      if (id(lower_display_page) == 0) {
        float f_temp  = id(fridge_temp).state;
        float fz_temp = id(freezer_temp).state;
        float c_temp  = id(compressor_temp).state;

        // Column 1: Fridge
        it.printf(65, 184, id(font_icons), c_blue, TextAlign::CENTER, "\U000F0290");
        
        if (!std::isnan(f_temp)) {
          Color f_text_color = c_white;
          
          float t_target = id(target_temp).state;
          if (std::isnan(t_target)) t_target = 5.0f;
          
          bool comp_running = id(compressor_state).state;
          
          // NEU: Vergleicht die auf Ganzzahlen gerundeten Werte
          if (roundf(f_temp) <= roundf(t_target)) {
            f_text_color = c_green;   // GREEN: Round(actual) <= Target (10.5° -> 10° -> Green)
          } else {
            if (comp_running) {
              f_text_color = c_red;     // RED: To warm AND compressor running
            } else {
              f_text_color = c_yellow;  // YELLOW: To warm AND compressor NOT running (Hysteresis or Locktime)
            }
          }
          
          it.printf(65, 204, id(font_medium), f_text_color, TextAlign::CENTER, "%.0f°", f_temp);
        } else {
          it.printf(65, 204, id(font_medium), c_dark_gray, TextAlign::CENTER, "--°");
        }

        // Column 2: Freezer
        Color fz_icon_color = id(freezer_guard_mode).state ? c_cyan : c_gray;
        it.printf(120, 184, id(font_icons), fz_icon_color, TextAlign::CENTER, "\U000F0717");
        
        if (!std::isnan(fz_temp)) {
          Color fz_text_color = c_white;
          
          if (id(freezer_guard_mode).state) {
            float fz_target = id(freezer_target_temp).state;
            if (std::isnan(fz_target)) fz_target = -10.0f;
            
            bool comp_running = id(compressor_state).state;
            
            if (roundf(fz_temp) <= roundf(fz_target)) {
              fz_text_color = c_green;   // GREEN: Round(actual) <= Target (-4.8° -> -5° -> Green)
            } else {
              if (comp_running) {
                fz_text_color = c_red;     // RED: To warm AND compressor running
              } else {
                fz_text_color = c_yellow;  // YELLOW: To warm AND compressor NOT running (Hysteresis or Locktime)
              }
            }
          }
          it.printf(120, 204, id(font_medium), fz_text_color, TextAlign::CENTER, "%.0f°", fz_temp);
        } else {
          it.printf(120, 204, id(font_medium), c_dark_gray, TextAlign::CENTER, "--°");
        }

        // Column 3: Compressor
        // Icon und Temperatur leuchten orange, wenn der Kompressor läuft, sonst grau
        bool comp_running = id(compressor_state).state;
        Color comp_ui_color = comp_running ? c_orange : c_gray;

        it.printf(175, 184, id(font_icons), comp_ui_color, TextAlign::CENTER, "\U000F0493");
        
        if (!std::isnan(c_temp)) {
          it.printf(175, 204, id(font_medium), comp_ui_color, TextAlign::CENTER, "%.0f°", c_temp);
        } else {
          it.printf(175, 204, id(font_medium), c_dark_gray, TextAlign::CENTER, "--°");
        }

      } else {
        float p_watt   = id(fridge_power).state;
        float v_batt   = id(fridge_voltage).state;
        float wifi_pct = id(wifi_signal_pct).state;

        // Column 1: Power (Icon static gray)
        it.printf(65, 184, id(font_icons), c_gray, TextAlign::CENTER, "\U000F0241");
        if (!std::isnan(p_watt)) it.printf(65, 204, id(font_medium), c_white, TextAlign::CENTER, "%.0fW", p_watt);
        else it.printf(65, 204, id(font_medium), c_dark_gray, TextAlign::CENTER, "--W");

        // Column 2: Battery
        it.printf(120, 184, id(font_icons), c_gray, TextAlign::CENTER, "\U000F010C");
        if (!std::isnan(v_batt)) it.printf(120, 204, id(font_medium), c_white, TextAlign::CENTER, "%.1fV", v_batt);
        else it.printf(120, 204, id(font_medium), c_dark_gray, TextAlign::CENTER, "--V");

        // Column 3: WiFi
        it.printf(175, 184, id(font_icons), c_gray, TextAlign::CENTER, "\U000F05A9");
        if (!std::isnan(wifi_pct)) it.printf(175, 204, id(font_medium), c_white, TextAlign::CENTER, "%.0f%%", wifi_pct); 
        else it.printf(175, 204, id(font_medium), c_dark_gray, TextAlign::CENTER, "--%%");
      }

interval:
  - interval: 10s
    then:
      - script.execute: fridge_logic

script:
  - id: compressor_start_routine
    mode: restart
    then:
      - lambda: 'id(in_soft_start) = true;' 
      - lambda: 'id(soft_start_start_time) = millis();'
      - switch.turn_on: compressor_state
      # Soft start with gentle low speed (0.32f)
      - lambda: 'id(secop_pwm_output).set_level(0.32f);' 
      - delay: 30s
      - lambda: 'id(in_soft_start) = false;' 
      - lambda: |-
          std::string mode = id(compressor_mode_select).current_option();
          float target_pct = id(compressor_preset_normal).state; 
          if (mode == "Night") target_pct = id(compressor_preset_night).state;
          else if (mode == "Normal") target_pct = id(compressor_preset_normal).state;
          else if (mode == "Power") target_pct = id(compressor_preset_power).state;
          else if (mode == "Manually") target_pct = id(compressor_speed_pct).state;
          
          id(compressor_speed_pct).make_call().set_value(target_pct).perform();

  - id: fridge_logic
    mode: restart
    then:
      - lambda: |-
          uint32_t now = millis();
          
          // --- LOG ENTRY AT THE TOP (Shows EVEN IF the fridge is OFF!) ---
          ESP_LOGD("fridge_logic", "Heartbeat: Script called. Main Switch status is: %s", 
                   id(fridge_main_switch).state ? "ON" : "OFF");
          
          float lock_state = id(startup_lock_duration).state;
          uint32_t lock_ms = (std::isnan(lock_state)) ? 30000 : (uint32_t)lock_state * 1000;
          
          // Abort if switch is off
          if (!id(fridge_main_switch).state) {
            if (id(compressor_state).state) id(compressor_state).turn_off();
            if (id(secop_error_text).state == "E1: Battery Low") id(secop_error_text).publish_state("OK");
            return; 
          }

          // --- 1. LOW VOLTAGE DISCONNECT (LVD) ---
          float cutoff_v  = id(low_voltage_cutoff).state;
          if (std::isnan(cutoff_v)) cutoff_v = 11.5f;
          
          if (cutoff_v <= 9.0f) {
            if (id(secop_error_text).state == "E1: Battery Low") {
              id(secop_error_text).publish_state("OK");
            }
          } else {
            float current_v = id(fridge_voltage).state;
            if (!std::isnan(current_v)) {
              bool currently_low = (id(secop_error_text).state == "E1: Battery Low");
              float recovery_v   = cutoff_v + 0.5f; 

              if ((currently_low && current_v < recovery_v) || (!currently_low && current_v < cutoff_v)) {
                if (id(compressor_state).state) {
                  id(compressor_state).turn_off();
                  id(last_compressor_stop) = now;
                }
                if (!currently_low) {
                  id(secop_error_text).publish_state("E1: Battery Low");
                  id(fridge_state_log).publish_state("Battery Empty!");
                  ESP_LOGE("fridge_logic", "!!! ABORT: Battery voltage too low !!!");
                }
                return; // Stops safely here, as cooling is not allowed without power
              } else if (currently_low) {
                id(secop_error_text).publish_state("OK"); 
              }
            }
          }

          // --- 2. SENSOR FAILSAFE ---
          float current_t = id(fridge_temp).state;
          float target_t = id(target_temp).state;
          float hyst = id(fridge_hysteresis).state;
          
          if (std::isnan(target_t)) target_t = 5.0f;
          if (std::isnan(hyst))     hyst = 1.5f;

          if (std::isnan(current_t)) {
            ESP_LOGW("fridge_logic", "Logic waiting: 'Temp Fridge' is currently NAN!");
            
            // Emergency shutdown if the compressor is running but the sensor suddenly fails!
            if (id(compressor_state).state) {
              id(compressor_state).turn_off();
              id(last_compressor_stop) = now;
              id(fridge_state_log).publish_state("Error: Sensor Failsafe");
              ESP_LOGE("fridge_logic", "!!! FAILSAFE: Compressor turned off due to missing sensor value !!!");
            }
            return;
          }

          // --- 3. TEMPERATURE LOGIC (DUAL SENSOR: FRIDGE & FREEZER GUARD) ---
          bool comp_on = id(compressor_state).state;

          // Freezer-Werte einlesen
          float fz_temp = id(freezer_temp).state;
          float fz_target = id(freezer_target_temp).state;
          bool fz_guard_active = id(freezer_guard_mode).state;

          if (std::isnan(fz_target)) fz_target = -10.0f;

          // Failsafe: Wenn der Freezer-Sensor fehlt, wird der Guard ignoriert
          if (fz_guard_active && std::isnan(fz_temp)) {
            ESP_LOGW("fridge_logic", "Freezer Guard aktiv, aber Sensorwert ist NAN! Ignoriere Freezer Guard.");
            fz_guard_active = false;
          }

          // Auswertung Hauptraum (Fridge)
          bool fridge_needs_cooling = (current_t >= (target_t + hyst));
          bool fridge_satisfied = (current_t <= target_t);

          bool freezer_needs_cooling = false;
          bool freezer_satisfied = true; // Standardmäßig true, blockiert nichts, wenn Modus OFF ist

          if (fz_guard_active) {
            freezer_needs_cooling = (fz_temp >= (fz_target + hyst));
            freezer_satisfied = (fz_temp <= fz_target);
          }

          ESP_LOGI("fridge_logic", "Check Fridge: %.1f/%.1f | Freezer (Guard %s): %.1f/%.1f | Comp: %s", 
                   current_t, target_t, fz_guard_active ? "ON" : "OFF", fz_temp, fz_target, comp_on ? "ON" : "OFF");

          // SWITCH ON (OR)
          if (fridge_needs_cooling || freezer_needs_cooling) {
            if (!comp_on) {
              if (id(last_compressor_stop) != 0 && (now - id(last_compressor_stop) < lock_ms)) {
                int wait_sec = (lock_ms - (now - id(last_compressor_stop))) / 1000;
                ESP_LOGW("fridge_logic", "Zu warm, aber Start blockiert durch Locktime! %ds warten", wait_sec);
                id(fridge_state_log).publish_state("Start blockiert (Locktime)");
              } else {
                if (freezer_needs_cooling && !fridge_needs_cooling) {
                  ESP_LOGI("fridge_logic", "Freezer zu warm (%.1f°C)! Starte Kompressor...", fz_temp);
                  id(fridge_state_log).publish_state("Freezer Guard: Starte...");
                } else {
                  ESP_LOGI("fridge_logic", "Fridge zu warm (%.1f°C)! Starte Kompressor...", current_t);
                  id(fridge_state_log).publish_state("Kühlschrank kühlt...");
                }
                id(compressor_start_routine).execute();
              }
            }
          } 
          // SWITCH OFF (AND)
          else if (fridge_satisfied && freezer_satisfied) {
            if (comp_on) {
              id(compressor_state).turn_off();
              id(last_compressor_stop) = now; 
              id(fridge_state_log).publish_state("Standby (Ziele erreicht)");
              ESP_LOGI("fridge_logic", "Alle Zieltemperaturen erreicht. Kompressor auf Standby.");
            }
          }
          
  - id: error_decode_script
    mode: restart
    then:
      - delay: 2s 
      - lambda: |-
          std::string msg = "OK";
          switch(id(error_pulse_count)) {
            case 1: msg = "E1: Low Voltage"; break;
            case 2: msg = "E2: Fan failure "; break;
            case 3: msg = "E3: Motor failure"; break;
            case 4: msg = "E4: Comp. Speed failure"; break;
            case 5: msg = "E5: Thermal failure"; break;
            case 6: msg = "E6: NTC Sensor failure"; break;
            case 7: msg = "E7: Communication error"; break;
            default: if(id(error_pulse_count) > 7) msg = "E?: Unknown"; break;
          }
          id(secop_error_text).publish_state(msg);
          id(error_pulse_count) = 0; 
      - delay: 8s 
      - lambda: 'id(secop_error_text).publish_state("OK");'
